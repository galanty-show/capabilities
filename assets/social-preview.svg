<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">Galanty 文影 — 改一处，回到那一秒</title>
<desc id="desc">Galanty — Change one thing. Back to that second. 让视频制作更简单。五步流程示意：打开播放、标注、交给 Agent、回到原秒、导出。</desc>
<rect width="1280" height="640" fill="#090F0E"/>
<rect width="10" height="640" fill="#C9F65A"/>
