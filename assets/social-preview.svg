<text x="68" y="546" fill="#F2F3EF" font-size="23" font-weight="600">Open &amp; play</text>
<text x="68" y="579" fill="#A8B8AF" font-size="17">打开播放</text>
<circle cx="302" cy="475" r="5" fill="#C9F65A"/>
